server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 生成的图片以 base64 放在 JSON 里返回，放宽请求体上限
    client_max_body_size 32m;

    # 生图 API：/api/xxx -> sd-server 的 /xxx
    #
    # 走变量 + resolver 而不是直接写死的 upstream 名字：换模型时 sd-server 会被重建、
    # 拿到新 IP，而 nginx 只在启动时解析一次域名，写死的话反代会一直指着旧容器（502）。
    # 用变量 + Docker 内置 DNS（127.0.0.11）后，每次请求都会按缓存时间重新解析。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $sd_upstream http://sd-server:1234;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass         $sd_upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 首次请求要等模型加载 + 推理，超时给足
        proxy_connect_timeout 60s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;
        proxy_buffering       off;
    }

    # 流程图 API：/diagram/mermaid/svg -> diagram 服务的 /mermaid/svg
    location /diagram/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $diagram_upstream http://diagram:8000;
        rewrite ^/diagram/?(.*)$ /$1 break;
        proxy_pass         $diagram_upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # 当前模型信息（由 scripts/use-model.sh 生成），不缓存，切换后刷新即生效
    location = /model.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # 模型切换控制面：/manager/state、/manager/switch
    # 切换是异步的（POST 立即返回，后台重建容器），所以超时不用给太长
    location /manager/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $manager_upstream http://manager:18235;
        rewrite ^/manager/?(.*)$ /$1 break;
        proxy_pass         $manager_upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 分割服务：/segment/segment、/segment/health
    # 首次请求要加载模型（约 10s），超时给足；图片走 base64，请求体上限已放宽到 32m
    location /segment/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $segmenter_upstream http://segmenter:8000;
        rewrite ^/segment/?(.*)$ /$1 break;
        proxy_pass         $segmenter_upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }

    # 静态资源：页面和 JSON 不缓存，JS/CSS 每次向服务端确认（304 时很便宜）。
    # 否则改了 lightbox.js / index.html 后浏览器还在用旧的，排查起来很费劲。
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:html)$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
